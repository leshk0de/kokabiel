---
# Path to a public key file (e.g. ~/.ssh/id_ed25519.pub) or the key text itself.
# Empty means no key is installed.
ssh_pubkey: ""
# Turn password login off once key login is verified from the controller.
disable_password_login: false
# Print the generated root passphrase at the end of the run.
show_secrets: true
# rotate_root_passphrase is intentionally not defaulted: when it is undefined
# and a passphrase file already exists, the play asks interactively.
hardening_pw_file: "{{ playbook_dir }}/logs/{{ inventory_hostname }}-root-passphrase.txt"
