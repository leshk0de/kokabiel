---
- name: Bootstrap Python on the probe
  hosts: kokabiel
  gather_facts: false
  roles:
    - bootstrap_python

- name: Configure the probe
  hosts: kokabiel
  gather_facts: false
  roles:
    - probe
    - hardening
    - sd

# Note: --limit does not apply here (localhost is outside the limit), so this
# play is skipped when running with --limit; the debug task is tagged always.
- name: Monitoring hand-off
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Print a Prometheus scrape config for the probes
      tags: [always]
      ansible.builtin.debug:
        msg: |-
          # Paste under scrape_configs: in prometheus.yml
          - job_name: kokabiel
            static_configs:
          {% for h in groups['kokabiel'] %}
              - targets: ['{{ hostvars[h].ansible_host | default(h) }}:9100']
                labels:
                  probe: {{ hostvars[h].probe_name | default(h) }}
          {% endfor %}
